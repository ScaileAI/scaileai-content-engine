name: Publish scheduled posts

# Hourly, not twice daily. Cron here is UTC and Mountain shifts with daylight
# saving, so a fixed UTC time would drift the posting slot by an hour twice a
# year. The publisher compares local time in the queue's own timezone instead,
# which never drifts and needs no seasonal maintenance.
#
# Minute 21 rather than 0: every scheduled job on the platform fires on the hour,
# and GitHub delays runs when its queues are busy.
on:
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would publish, without publishing'
        type: boolean
        default: false

# Needed so the job can write the queue back after publishing, which is what
# stops a post going out twice.
permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Publish anything due
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BASE_URL: ${{ secrets.IG_BASE_URL }}
        run: node engine/run-publisher.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Record what was published
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain engine/queue.json)" ]]; then
            git config user.name  "scaileai-content-engine"
            git config user.email "actions@users.noreply.github.com"
            git add engine/queue.json
            git commit -m "publish: update queue [skip ci]"
            git push
          else
            echo "queue unchanged, nothing to commit"
          fi
